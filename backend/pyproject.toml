[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-trading-agent"
version = "0.1.0"
description = "Single-agent local-first trading research and paper-trading system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "portalocker>=2.10,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6,<1.0",
]
dev = ["mypy>=1.11,<2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
